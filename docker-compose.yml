services:
  # 质检 API：宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080。
  api:
    build: .
    image: media-qc:latest
    environment:
      QC_PORT: "8080"
    ports:
      # 可变宿主机端口：HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  # 一次性校验服务：等待 API 就绪后执行单元测试、构建检查与 API 冒烟，
  # 以退出码汇总结果后退出（docker compose up 中表现为 Exited(0/1)）。
  verify:
    build: .
    image: media-qc:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE: "http://api:8080"
      APP_ROOT: "/app"
      READY_TIMEOUT: "60"
    entrypoint: ["python", "scripts/verify.py"]
    restart: "no"
